              'change_requests',
              'task_plan_links',
              'release_acceptance_packages'
            ]
            LOOP
              SELECT c.relforcerowsecurity INTO v_forced
              FROM pg_class c
              WHERE c.relname = m6b_tbl AND c.relnamespace = 'public'::regnamespace;
              IF v_forced IS NOT TRUE THEN
                RAISE EXCEPTION '6f1faa8 upgrade: missing FORCE ROW LEVEL SECURITY on %', m6b_tbl;
