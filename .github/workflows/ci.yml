            ) VALUES
              (v_rs_a,  v_proj_a, v_task_a, v_cand_a,  v_vr_a,  'rev-a1', 'rev-cred-a1', 'prof-rev-a', 'google', 'gemini-2.5-pro', 'ROLE_REVIEWER_READONLY', 'linux-supervisor', 'COMPLETED'),
