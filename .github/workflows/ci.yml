            END IF;

            UPDATE review_artifacts
              SET status = 'INVALIDATED_STALE_BASE', is_invalidated = TRUE, invalidated_reason = 'ci_rls_probe'
              WHERE review_artifact_id = v_ra_a;
            GET DIAGNOSTICS v_cnt = ROW_COUNT;
            IF v_cnt <> 1 THEN
