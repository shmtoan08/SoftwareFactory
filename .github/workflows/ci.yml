            v_caught := false;
            BEGIN
              INSERT INTO stage1_discovery_items (
                item_id, project_id, pipeline_session_id, kind, title, statement, rationale, confirmation_status
              ) VALUES (
                gen_random_uuid(), v_proj_a, v_pps_a_act, 'ASSUMPTION', 'Bad Assump', 'Invalid auto-verify', 'R', 'AUTO_VERIFIED'
              );
            EXCEPTION WHEN check_violation THEN v_caught := true;
            END;
            IF NOT v_caught THEN RAISE EXCEPTION 'chk_s1_assumption_not_auto_verified failed'; END IF;

            v_caught := false;
            BEGIN
              INSERT INTO stage1_discovery_items (
                item_id, project_id, pipeline_session_id, kind, title, statement, rationale, confirmation_status
              ) VALUES (
                gen_random_uuid(), v_proj_a, v_pps_a_act, 'RECOMMENDATION', 'Bad Rec', 'Invalid auto-verify', 'R', 'AUTO_VERIFIED'
              );
            EXCEPTION WHEN check_violation THEN v_caught := true;
            END;
            IF NOT v_caught THEN RAISE EXCEPTION 'chk_s1_recommendation_not_auto_verified failed'; END IF;

            v_caught := false;
            BEGIN
              INSERT INTO stage_artifacts (
                artifact_id, project_id, pipeline_session_id, stage, artifact_kind, version,
