              );
            EXCEPTION WHEN insufficient_privilege THEN v_caught := true;
            END;
            IF NOT v_caught THEN RAISE EXCEPTION 'Cross-tenant INSERT into merge_operations was not blocked'; END IF;

            -- 4. Cross-tenant UPDATE affects 0 rows
            UPDATE review_sessions SET status = 'REVOKED' WHERE project_id = v_proj_b;
            GET DIAGNOSTICS v_cnt = ROW_COUNT;
            IF v_cnt <> 0 THEN RAISE EXCEPTION 'Cross-tenant UPDATE modified review_sessions rows: %', v_cnt; END IF;

            UPDATE approval_requests SET status = 'REJECTED' WHERE project_id = v_proj_b;
            GET DIAGNOSTICS v_cnt = ROW_COUNT;
            IF v_cnt <> 0 THEN RAISE EXCEPTION 'Cross-tenant UPDATE modified approval_requests rows: %', v_cnt; END IF;

            UPDATE merge_operations SET status = 'MERGED' WHERE project_id = v_proj_b;
            GET DIAGNOSTICS v_cnt = ROW_COUNT;
            IF v_cnt <> 0 THEN RAISE EXCEPTION 'Cross-tenant UPDATE modified merge_operations rows: %', v_cnt; END IF;

            -- 5. DELETE denied on M4 tables for app_runtime
            FOREACH tbl IN ARRAY ARRAY['review_sessions', 'approval_requests', 'merge_operations']
            LOOP
              v_caught := false;
              BEGIN
                EXECUTE format('DELETE FROM %I', tbl);
              EXCEPTION WHEN insufficient_privilege THEN v_caught := true;
              END;
              IF NOT v_caught THEN
