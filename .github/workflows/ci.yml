            SELECT count(*) INTO v_cnt FROM merge_operations;
            IF v_cnt <> 1 THEN RAISE EXCEPTION 'merge_operations tenant SELECT mismatch for Project A: got %', v_cnt; END IF;
            SELECT count(*) INTO v_cnt FROM merge_operations WHERE project_id = v_proj_b;
            IF v_cnt <> 0 THEN RAISE EXCEPTION 'merge_operations leaked Project B rows to Project A'; END IF;

            -- 3. Cross-tenant INSERT blocked (42501 insufficient_privilege)
            v_caught := false;
            BEGIN
              INSERT INTO review_sessions (
                review_session_id, project_id, task_id, merge_candidate_id, verification_run_id,
                reviewer_principal_id, reviewer_credential_id, reviewer_agent_profile_id,
                reviewer_provider, reviewer_model, role, sandbox_backend_mode, status
              ) VALUES (
                gen_random_uuid(), v_proj_b, v_task_b, v_cand_b, v_vr_b,
                'intruder', 'intr-cred', 'intr-prof', 'google', 'gemini-2.5-pro',
                'ROLE_REVIEWER_READONLY', 'linux-supervisor', 'ACTIVE'
              );
            EXCEPTION WHEN insufficient_privilege THEN v_caught := true;
            END;
            IF NOT v_caught THEN RAISE EXCEPTION 'Cross-tenant INSERT into review_sessions was not blocked'; END IF;

            v_caught := false;
            BEGIN
              INSERT INTO approval_requests (
                approval_request_id, project_id, task_id, merge_candidate_id,
                agent_commit_hash, base_main_commit_hash, merge_candidate_hash, verified_tree_hash,
                verification_run_id, review_artifact_id, status, expires_at, created_at
              ) VALUES (
                gen_random_uuid(), v_proj_b, v_task_b, v_cand_b,
                repeat('d', 40), repeat('2', 40), repeat('f', 40), repeat('e', 40),
                v_vr_b, v_ra_b, 'PENDING', clock_timestamp() + interval '1 hour', clock_timestamp()
              );
            EXCEPTION WHEN insufficient_privilege THEN v_caught := true;
            END;
            IF NOT v_caught THEN RAISE EXCEPTION 'Cross-tenant INSERT into approval_requests was not blocked'; END IF;

            v_caught := false;
            BEGIN
              INSERT INTO merge_operations (
