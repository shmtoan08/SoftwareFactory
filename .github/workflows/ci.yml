              current_stage, status, created_by_principal_id
            ) VALUES
              (v_pps_a,     v_proj_a, v_mcs_a, 'CI Frozen Pipeline A', 'Deterministic release', 'STAGE_4_SPEC_FREEZE', 'ACTIVE', 'alice-dev'),
              (v_pps_a_act, v_proj_a, v_mcs_a, 'CI Active Pipeline A', 'Active AC-10 probe',    'STAGE_1_IDEA_DISCOVERY', 'ACTIVE', 'alice-dev'),
              (v_pps_b,     v_proj_b, v_mcs_b, 'CI Pipeline B',        'Cross-tenant pipeline', 'STAGE_1_IDEA_DISCOVERY', 'ACTIVE', 'bob-dev');

            INSERT INTO model_call_ledgers (
              call_id, project_id, cost_session_id, pipeline_session_id, task_id, stage,
              provider, model, prompt_id, prompt_version, prompt_sha256, request_sha256,
              estimated_input_tokens, reserved_output_tokens, actual_input_tokens, actual_output_tokens,
              actual_total_tokens, estimated_cost_micro_usd, actual_cost_micro_usd, status, latency_ms
            ) VALUES
              (gen_random_uuid(), v_proj_a, v_mcs_a, v_pps_a, v_task_a, 'STAGE_1_IDEA_DISCOVERY', 'anthropic', 'claude-sonnet-4', 'pipeline.stage1.discovery', '1.0.0', repeat('1', 64), repeat('2', 64), 100, 100, 100, 100, 200, 1000, 1000, 'ALLOWED', 25),
              (gen_random_uuid(), v_proj_b, v_mcs_b, v_pps_b, v_task_b, 'STAGE_1_IDEA_DISCOVERY', 'openai',    'gpt-4.1',         'pipeline.stage1.discovery', '1.0.0', repeat('3', 64), repeat('4', 64), 100, 100, 100, 100, 200, 1000, 1000, 'ALLOWED', 30);

            INSERT INTO stage1_discovery_items (
              item_id, project_id, pipeline_session_id, kind, title, statement, rationale,
              clarification_question, confirmation_status, confirmed_by_principal_id, confirmed_at
            ) VALUES
              (v_s1_fact_a,       v_proj_a, v_pps_a,     'FACT',       'Fact A',   'Confirmed fact',       'Given',  NULL,          'AUTO_VERIFIED', NULL,             NULL),
              (v_s1_assump_a,     v_proj_a, v_pps_a,     'ASSUMPTION', 'Assump A', 'Confirmed assumption', 'Q&A ok', 'Confirm SLA?', 'CONFIRMED',    'alice-approver', clock_timestamp()),
              (v_s1_act_unconf_a, v_proj_a, v_pps_a_act, 'ASSUMPTION', 'Unconf A', 'Unconfirmed assumption','Pending','Confirm?',    'UNCONFIRMED',   NULL,             NULL),
              (v_s1_fact_b,       v_proj_b, v_pps_b,     'FACT',       'Fact B',   'Project B fact',       'Given',  NULL,          'AUTO_VERIFIED', NULL,             NULL);

