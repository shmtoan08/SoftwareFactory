            ) VALUES
              (v_ra_a,  v_proj_a, v_task_a, v_cand_a,  v_vr_a,  repeat('5', 40), repeat('4', 40), 'anthropic', 'claude-sonnet-4', 'google', 'gemini-2.5-pro', 'dev-a', 'rev-a1', 'dev-sess-a1', 'rev-sess-a1', 'dev-cred-a1', 'rev-cred-a1', 'prof-dev-a', 'prof-rev-a', v_rs_a,  'PASS', 'VALID'),
