            -- 6. Column-level UPDATE GRANT enforcement on review_artifacts
            v_caught := false;
            BEGIN
              UPDATE review_artifacts SET verdict = 'FAIL' WHERE review_artifact_id = v_ra_a;
            EXCEPTION WHEN insufficient_privilege THEN v_caught := true;
            END;
            IF NOT v_caught THEN
