          # 3. Apply HEAD 0008_m6b_stages_5_9_and_traceability.sql twice (upgrade + idempotency) + 0002 RLS matrix
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0008_m6b_stages_5_9_and_traceability.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0008_m6b_stages_5_9_and_traceability.sql
