              (v_ra_b,  v_proj_b, v_task_b, v_cand_b,  v_vr_b,  repeat('f', 40), repeat('e', 40), 'anthropic', 'claude-sonnet-4', 'google', 'gemini-2.5-pro', 'dev-b', 'rev-b1', 'dev-sess-b1', 'rev-sess-b1', 'dev-cred-b1', 'rev-cred-b1', 'prof-dev-b', 'prof-rev-b', v_rs_b,  'PASS', 'VALID');

            INSERT INTO approval_requests (
              approval_request_id, project_id, task_id, merge_candidate_id,
              agent_commit_hash, base_main_commit_hash, merge_candidate_hash, verified_tree_hash,
              verification_run_id, review_artifact_id, status, expires_at, created_at
            ) VALUES
              (v_ar_a,  v_proj_a, v_task_a, v_cand_a,  repeat('3', 40), repeat('1', 40), repeat('5', 40), repeat('4', 40), v_vr_a,  v_ra_a,  'APPROVED', clock_timestamp() + interval '1 hour', clock_timestamp()),
              (v_ar_a2, v_proj_a, v_task_a, v_cand_a2, repeat('3', 40), repeat('6', 40), repeat('7', 40), repeat('8', 40), v_vr_a2, v_ra_a2, 'PENDING',  clock_timestamp() + interval '1 hour', clock_timestamp()),
              (v_ar_b,  v_proj_b, v_task_b, v_cand_b,  repeat('d', 40), repeat('2', 40), repeat('f', 40), repeat('e', 40), v_vr_b,  v_ra_b,  'APPROVED', clock_timestamp() + interval '1 hour', clock_timestamp());

