            END IF;

            UPDATE review_artifacts
              SET status = 'INVALIDATED_STALE_BASE', is_invalidated = TRUE
              WHERE review_artifact_id = v_ra_b;
            GET DIAGNOSTICS v_cnt = ROW_COUNT;
            IF v_cnt <> 0 THEN
