            SELECT count(*) INTO v_cnt FROM review_sessions WHERE project_id = v_proj_b;
            IF v_cnt <> 0 THEN RAISE EXCEPTION 'review_sessions leaked Project B rows to Project A'; END IF;

            SELECT count(*) INTO v_cnt FROM approval_requests;
            IF v_cnt <> 2 THEN RAISE EXCEPTION 'approval_requests tenant SELECT mismatch for Project A: got %', v_cnt; END IF;
            SELECT count(*) INTO v_cnt FROM approval_requests WHERE project_id = v_proj_b;
